version: "3.9"

services:
  api:
    build: .
    container_name: logiq-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Local Compose: Redis hostname is service name `redis` (override in untracked .env)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Neo4j hostname inside Compose network (override in .env for host-local uvicorn)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
    # Dev: mount full repo so mounted api/integrations code matches host (avoids stale image).
    # Python deps remain in the image (/usr/local); only /app source is overlaid.
    volumes:
      - .:/app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Allow API container to reach Ollama on the host (Linux Docker; Desktop includes this by default).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
      - redis

  redis:
    image: redis:7-alpine
    container_name: logiq-redis
    ports:
      - "6379:6379"
    # Dev-friendly: no AOF/RDB persistence (no volumes)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: neo4j-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
