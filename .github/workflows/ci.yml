name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - uat
      - 'release/*'
  pull_request:
    branches:
      - main
      - develop
      - uat
      - 'release/*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Setting PYTHONPATH to the current directory is often required for pytest to discover modules in the root properly.
        run: |
          PYTHONPATH=. pytest tests/
